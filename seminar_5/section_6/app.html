<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Căutare persoană</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const apiUrl = 'http://localhost:8000/api/';

        async function get(url) {
            return (await axios.get(url)).data;
        }

        async function searchById() {
            const id = document.getElementById('idInput').value;
            const resultDiv = document.getElementById('result');

            if (!id) {
                alert('Introduceti un ID!');
                return;
            }

            try {
                const data = await get(apiUrl + "getById/" + id);

                resultDiv.innerHTML = `
                    <p><strong>ID:</strong> ${data.id}</p>
                    <p><strong>Nume:</strong> ${data.name}</p>
                    <p><strong>Vârstă:</strong> ${data.age}</p>
                `;
            } catch (err) {
                resultDiv.innerHTML = `<p style="color:red;">Resursa cu ID-ul ${id} nu a fost gasita!</p>`;
            }
        }
    </script>
</head>
<body>
    <h1>Căutare persoană după ID</h1>

    <form onsubmit="event.preventDefault(); searchById();">
        <label for="idInput">ID: </label>
        <input type="number" id="idInput" placeholder="Introduceti ID-ul">
        <button type="submit">Caută</button>
    </form>

    <div id="result" style="margin-top:20px;"></div>
</body>
</html>
